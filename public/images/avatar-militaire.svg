<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 84" width="84" height="84">
  <!-- Fond blanc -->
  <rect width="84" height="84" fill="#ffffff"/>

  <!-- Casquette militaire -->
  <path d="M20 24 Q42 16 64 24 L62 28 Q42 22 22 28 Z" fill="#1a4731"/>
  <rect x="20" y="27" width="44" height="3" rx="1.5" fill="#2d6b4a"/>
  <!-- Insigne doré sur la casquette -->
  <circle cx="42" cy="22" r="3" fill="#c9a84c"/>

  <!-- Visage -->
  <ellipse cx="42" cy="36" rx="12" ry="13" fill="#d4a87a"/>
  <!-- Yeux -->
  <circle cx="37" cy="35" r="1.2" fill="#3a2a1a"/>
  <circle cx="47" cy="35" r="1.2" fill="#3a2a1a"/>
  <!-- Sourire discret -->
  <path d="M38 42 Q42 44 46 42" stroke="#a07050" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Uniforme militaire -->
  <path d="M16 84 Q16 54 42 50 Q68 54 68 84 Z" fill="#1a4731"/>
  <!-- Col -->
  <path d="M35 52 L42 56 L49 52 L49 60 Q42 62 35 60 Z" fill="#0f2b1e"/>
  <!-- Boutons dorés -->
  <circle cx="42" cy="64" r="1.8" fill="#c9a84c"/>
  <circle cx="42" cy="72" r="1.8" fill="#c9a84c"/>
  <circle cx="42" cy="80" r="1.8" fill="#c9a84c"/>

  <!-- Épaulettes dorées -->
  <rect x="18" y="55" width="10" height="4" rx="1" fill="#c9a84c"/>
  <rect x="56" y="55" width="10" height="4" rx="1" fill="#c9a84c"/>

  <!-- Mini-barre drapeau malien sur l'épaule gauche -->
  <rect x="18" y="60" width="3.3" height="2.5" fill="#14b53a"/>
  <rect x="21.3" y="60" width="3.3" height="2.5" fill="#fcd116"/>
  <rect x="24.6" y="60" width="3.3" height="2.5" fill="#ce1126"/>
</svg>
