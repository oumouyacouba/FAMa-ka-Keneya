<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Fond : cercle vert foncé -->
  <circle cx="16" cy="16" r="15" fill="#0f2b1e"/>
  <!-- Bordure dorée -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="#c9a84c" stroke-width="2"/>
  <!-- Initiales FK en doré -->
  <text
    x="16"
    y="18"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="11"
    font-weight="800"
    fill="#c9a84c"
    text-anchor="middle"
    letter-spacing="0.5"
  >FK</text>
  <!-- Mini-barre drapeau malien en bas du cercle -->
  <clipPath id="clip-circle">
    <circle cx="16" cy="16" r="14"/>
  </clipPath>
  <g clip-path="url(#clip-circle)">
    <rect x="3"  y="27" width="8.7" height="3" fill="#14b53a"/>
    <rect x="11.7" y="27" width="8.6" height="3" fill="#fcd116"/>
    <rect x="20.3" y="27" width="8.7" height="3" fill="#ce1126"/>
  </g>
</svg>
